<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tài liệu · C12</title><style>*{box-sizing:border-box}body{margin:0;color:#26364c;background:#f7f9fc;font:16px/1.7 'Segoe UI',sans-serif}header{padding:16px 28px;background:#fff;border-bottom:1px solid #d7dfeb;display:flex;gap:26px;align-items:center}a{color:#185cba}main{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1450px;margin:auto}nav{padding:26px 18px;position:sticky;top:0;align-self:start}nav button{display:block;text-align:left;width:100%;padding:12px;border:0;background:transparent;color:inherit;border-radius:8px;font:inherit;cursor:pointer}nav button[aria-current=true]{background:#e0ebfa;color:#174d9c}article{margin:26px;padding:32px 40px;background:#fff;border:1px solid #dce3ec;border-radius:12px;min-width:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}table{border-collapse:collapse;display:block;overflow:auto;width:100%;font-size:14px}th,td{padding:9px 12px;border:1px solid #dce3ec;text-align:left}h1,h2,h3{line-height:1.3;color:#172c48}h1{font-size:30px}h2{font-size:23px;margin-top:36px}code{background:#f0f4f9;padding:2px 4px;border-radius:4px}button:focus-visible{outline:3px solid #1d65bd}@media(max-width:760px){main{display:block}nav{position:static;display:flex;overflow:auto;padding:12px}nav button{min-width:140px}article{margin:12px;padding:22px}header{padding:12px}}</style><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script></head><body><header><a href="../">Về trang preview</a><strong>Tài liệu sản phẩm C12</strong></header><main><nav id="nav" aria-label="Tài liệu"></nav><article id="content" aria-live="polite">Đang tải tài liệu…</article></main><script>
const files={README:'Bắt đầu',PRD:'Yêu cầu sản phẩm',CONTEXT:'Bối cảnh và quyết định',SPEC:'Đặc tả chức năng',PLAN:'Kế hoạch triển khai',TECH_ARCHITECTURE:'Kiến trúc kỹ thuật',REQUIREMENTS_TRACE:'Truy vết yêu cầu',OPEN_QUESTIONS:'Câu hỏi còn mở',QA:'QA v4 (lịch sử)',QA_CHANGE:'Kiểm tra bản mới',CHANGE_REQUIREMENTS:'Thay đổi 16/11',PERMISSIONS:'Ma trận quyền',VALIDATION:'Kiểm tra đặc tả',ROOT_REVIEW:'Kết quả kiểm tra của root'};const nav=document.querySelector('#nav'),content=document.querySelector('#content');for(const [key,label]of Object.entries(files)){const b=document.createElement('button');b.textContent=label;b.dataset.key=key;b.onclick=()=>{location.hash=key};nav.append(b)}async function show(){const key=files[location.hash.slice(1)]?location.hash.slice(1):'README';nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.key===key)));try{const r=await fetch(key+'.md');if(!r.ok)throw Error('Không tải được tài liệu');const text=await r.text();if(window.marked&&window.DOMPurify)content.innerHTML=DOMPurify.sanitize(marked.parse(text));else{const p=document.createElement('pre');p.textContent=text;content.replaceChildren(p)}}catch(e){content.textContent=e.message}}window.addEventListener('hashchange',show);show();
</script></body></html>
